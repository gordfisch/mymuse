PLG_COM_MYMUSE_STORAGE_S3="Stockage MyMuse S3"
COM_MYMUSE_ENABLE_S3_STORAGE="Utilisez AWS S3 pour stocker vos fichiers"

COM_MYMUSE_USE_S3_LABEL="Intégration S3"
COM_MYMUSE_USE_S3_DESC="MyMuse peut éventuellement s'intégrer à Amazon S3 pour stocker vos fichiers téléchargés. Vous aurez besoin d'un abonnement Amazon S3. Entrez les noms de compartiment dans les répertoires Download et preview."
COM_MYMUSE_CONFIG_S3_ACCESSKEY_LABEL="Clé d'accès"
COM_MYMUSE_CONFIG_S3_ACCESSKEY_DESC="Votre clé d'accès Amazon S3. Vous pouvez en créer une ou trouver votre clé existante sur http://s3.amazonaws.com."
COM_MYMUSE_CONFIG_S3_SECRETKEY_LABEL="Clé secrète"
COM_MYMUSE_CONFIG_S3_SECRETKEY_DESC="Votre clé secrète Amazon S3. Vous pouvez en créer une ou trouver votre clé existante à l'adresse http://s3.amazonaws.com."
COM_MYMUSE_CONFIG_S3_BUCKET_LABEL="Bucket"
COM_MYMUSE_CONFIG_S3_BUCKET_DESC="Le compartiment Amazon S3 dans lequel vos fichiers seront / seront stockés. Le compartiment doit exister (MyMuse ne peut pas le créer pour vous). L'utilisateur identifié par la clé d'accès et la clé secrète fournie ci-dessus doit avoir au moins l'accès en lecture au Seau pour que les téléchargements fonctionnent. IMPORTANT! Les noms de seau sont sensibles à la casse. Abc, abc et ABC sont trois seaux <em> différents </ em> en ce qui concerne Amazon S3! "
COM_MYMUSE_CONFIG_S3_PERMS_LABEL="Autorisations par défaut"
COM_MYMUSE_CONFIG_S3_PERMS_DESC="Autorisations par défaut à appliquer aux fichiers téléchargés dans le compartiment de répertoire de téléchargement Amazon S3"
COM_MYMUSE_CONFIG_S3_PERMS_PRIVATE="Privé (recommandé)"
COM_MYMUSE_CONFIG_S3_PERMS_PUBLIC_READ="Tout le monde peut lire"
COM_MYMUSE_CONFIG_S3_PERMS_PUBLIC_READ_WRITE="Tout le monde peut lire et écrire"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_AUTHENTICATED_READ="Les utilisateurs authentifiés peuvent lire"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_BUCKET_OWNER_READ="Privé, mais le propriétaire du compartiment peut le lire"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_BUCKET_OWNER_FULL_CONTROL="Privé, mais le propriétaire du compartiment possède le contrôle total"
COM_MYMUSE_CONFIG_S3_TIME_LABEL="Délai d'attente pour les URL authentifiées"
COM_MYMUSE_CONFIG_S3_TIME_DESC="MyMuse crée ce que Amazon appelle les URL authentifiées pour les téléchargements de tous les éléments stockés dans des compartiments S3. Ces URL sont conçues pour expirer au bout d'un délai prédéfini. Cette option contrôle la date d'expiration de ces URL de téléchargement. Conservez cette limite courte. Augmentez uniquement cette limite. Si vous hébergez des fichiers volumineux et que vous voulez que vos utilisateurs puissent utiliser des gestionnaires de téléchargement, tels que DownThemAll, qui établissent plusieurs connexions tout au long du processus de téléchargement. IMPORTANT! Assurez-vous que votre horloge est synchronisée avec un serveur de temps pour que cette fonctionnalité fonctionne comme prévu et autoriser le téléchargement de fichiers stockés sur Amazon S3. "
COM_MYMUSE_CONFIG_S3_TIME_1MINUTE="1 minute (recommandé)"
COM_MYMUSE_CONFIG_S3_TIME_15MINUTES="15 minutes"
COM_MYMUSE_CONFIG_S3_TIME_1HOUR="1 heure"
COM_MYMUSE_CONFIG_S3_TIME_6HOURS="6 heures"
COM_MYMUSE_CONFIG_S3_TIME_12HOURS="12 heures"
COM_MYMUSE_CONFIG_S3_TIME_1DAY="Un jour"
COM_MYMUSE_CONFIG_S3_TIME_7DAYS="Une semaine"
COM_MYMUSE_CONFIG_S3_TIME_1MONTH="Un mois"
COM_MYMUSE_CONFIG_S3_WEB_LABEL="Site Web S3"
COM_MYMUSE_CONFIG_S3_WEB_DESC="Pour afficher vos aperçus à partir du stockage S3, entrez le point de terminaison. Exemple: http://mymusetestpreviews.s3-website-us-west-2.amazonaws.com"
COM_MYMUSE_S3_FILE_TOO_LARGE_TO_COPY="Le fichier était trop volumineux pour être copié et transféré. <br /> Vous voudrez peut-être renommer <br />% s en <br />% s <br /> et rétablir cette opération."
COM_MYMUSE_CONFIG_S3_REGION_LABEL="Région S3"
COM_MYMUSE_CONFIG_S3_REGION_DESC="Ex: us-west-2"
COM_MYMUSE_CONFIG_S3_ASCCELERATE_LABEL="Accélération S3"
COM_MYMUSE_CONFIG_S3_ASCCELERATE_DESC="Utiliser S3 Accelerate. Doit être activé pour la prévisualisation et le téléchargement de buskets sur Amazon S3"