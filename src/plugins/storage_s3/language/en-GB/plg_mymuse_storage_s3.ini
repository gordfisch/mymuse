PLG_COM_MYMUSE_STORAGE_S3="MyMuse Storage S3"
COM_MYMUSE_ENABLE_S3_STORAGE="Use AWS S3 to store your files"

COM_MYMUSE_USE_S3_LABEL="S3 Integration"
COM_MYMUSE_USE_S3_DESC="MyMuse can optionally integrate with Amazon S3 to store your download files. You will need an Amazon S3 subscription. Enter bucket names in the Download and preview directories."
COM_MYMUSE_CONFIG_S3_ACCESSKEY_LABEL="Access Key"
COM_MYMUSE_CONFIG_S3_ACCESSKEY_DESC="Your Amazon S3 Access Key. You can create one or find your existing one at http://s3.amazonaws.com."
COM_MYMUSE_CONFIG_S3_SECRETKEY_LABEL="Secret Key"
COM_MYMUSE_CONFIG_S3_SECRETKEY_DESC="Your Amazon S3 Secret Key. You can create one or find your existing one at http://s3.amazonaws.com."
COM_MYMUSE_CONFIG_S3_BUCKET_LABEL="Bucket"
COM_MYMUSE_CONFIG_S3_BUCKET_DESC="The Amazon S3 bucket where your files will be / are stored. The bucket must exist (MyMuse can't create it for you). The user identifed by the Access and Secret Key provided above must have at least read access to the bucket for downloads to work. IMPORTANT! Bucket names are case sensitive. Abc, abc and ABC are three <em>different</em> buckets as far as Amazon S3 is concerned!"
COM_MYMUSE_CONFIG_S3_PERMS_LABEL="Default permissions"
COM_MYMUSE_CONFIG_S3_PERMS_DESC="Default permissions to apply to files which are uploaded to Amazon S3 Download Directory Bucket"
COM_MYMUSE_CONFIG_S3_PERMS_PRIVATE="Private (recommended)"
COM_MYMUSE_CONFIG_S3_PERMS_PUBLIC_READ="Everyone can read"
COM_MYMUSE_CONFIG_S3_PERMS_PUBLIC_READ_WRITE="Everyone can read and write"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_AUTHENTICATED_READ="Authenticated users can read"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_BUCKET_OWNER_READ="Private, but bucket owner can read"
COM_MYMUSE_CONFIG_S3_PERMS_ACL_BUCKET_OWNER_FULL_CONTROL="Private, but bucket owner has full control"
COM_MYMUSE_CONFIG_S3_TIME_LABEL="Timeout for authenticated URLs"
COM_MYMUSE_CONFIG_S3_TIME_DESC="MyMuse creates what Amazon calls authenticated URLs for downloads of all items stored in S3 buckets. These URLs are designed to expire after a predefined amount of time. This option controls when these download URLs will expire. Keep this limit short. Increase only if you are hosting large files and you want your users to be able to use download managers, such as DownThemAll, which launch several connections over the duration of the entire download process. IMPORTANT! Make sure your server clock is synchronised with a time server in order for this feature to work as expected and allow downloads of files stored on Amazon S3."
COM_MYMUSE_CONFIG_S3_TIME_1MINUTE="1 minute (recommended)"
COM_MYMUSE_CONFIG_S3_TIME_15MINUTES="15 minutes"
COM_MYMUSE_CONFIG_S3_TIME_1HOUR="1 hour"
COM_MYMUSE_CONFIG_S3_TIME_6HOURS="6 hours"
COM_MYMUSE_CONFIG_S3_TIME_12HOURS="12 hours"
COM_MYMUSE_CONFIG_S3_TIME_1DAY="One day"
COM_MYMUSE_CONFIG_S3_TIME_7DAYS="One week"
COM_MYMUSE_CONFIG_S3_TIME_1MONTH="One month"
COM_MYMUSE_CONFIG_S3_WEB_LABEL="S3 Website"
COM_MYMUSE_CONFIG_S3_WEB_DESC="To show your previews from S3 storage, enter the endpoint. Ex: http://mymusetestpreviews.s3-website-us-west-2.amazonaws.com"
COM_MYMUSE_S3_FILE_TOO_LARGE_TO_COPY="File was too large to copy and reupload. <br />You may want to rename <br />%s to <br />%s<br />and redo this operation."
COM_MYMUSE_CONFIG_S3_REGION_LABEL="S3 Region"
COM_MYMUSE_CONFIG_S3_REGION_DESC="Ex: us-west-2"
COM_MYMUSE_CONFIG_S3_ASCCELERATE_LABEL="S3 Accelerate"
COM_MYMUSE_CONFIG_S3_ASCCELERATE_DESC="Use S3 Accelerate. Must be enabled for both preview and download buskets at Amazon S3"
